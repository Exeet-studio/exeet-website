<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Project / EXEET</title>

  <link rel="stylesheet" href="css/style.css?v=15">
</head>

<body>

  <main class="page detail">

    <div class="section-head">

      <div>
        <div id="projectMeta" class="eyebrow"></div>
        <h1 id="projectTitle" class="title"></h1>
      </div>

      <a class="eyebrow" href="projects.html">
        Back →
      </a>

    </div>


    <div
      id="projectVideoSection"
      class="hero-media"
      hidden>

      <iframe
        id="projectVideo"
        title="Project Video"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>


    <div
      id="projectImageSection"
      class="hero-media"
      hidden>

      <img
        id="projectImage"
        src=""
        alt="">

    </div>


    <div class="detail-grid">

      <div>

        <div class="eyebrow">
          Description
        </div>

        <div
          id="projectDesc"
          class="muted">
        </div>

      </div>


      <div>

        <div class="eyebrow">
          Project Info
        </div>

        <div
          id="projectInfo"
          class="muted">
        </div>

        <div
          id="projectCredits"
          style="margin-top:28px">
        </div>

      </div>

    </div>


    <section
    id="projectGallerySection"
    class="member-project-gallery-section"
    hidden>

    <div class="eyebrow">
        Gallery
    </div>

    <div
        id="projectGallery"
        class="member-project-gallery">
    </div>

</section>
    
  </main>


  <script src="data.js?v=17"></script>
<script src="js/main.js?v=17"></script>

<script>
  initProjectDetail();
</script>

</body>

</html>
